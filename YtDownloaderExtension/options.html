<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>YT-DLP Extension Settings</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1117;
            color: #e4e6eb;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 6px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        h1::before {
            content: '';
            width: 5px;
            height: 26px;
            background: linear-gradient(180deg, #6366f1, #8b5cf6);
            border-radius: 3px;
        }
        .subtitle {
            color: #6b7280;
            font-size: 13px;
            margin: 0 0 28px 17px;
        }

        .section {
            background: #1a1d27;
            border: 1px solid #2a2e3b;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .section h3 {
            font-size: 12px;
            font-weight: 600;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 0 0 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 12px;
            color: #9ca3af;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px 12px;
            background: #0f1117;
            border: 1px solid #2a2e3b;
            border-radius: 10px;
            color: #e4e6eb;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        input[type="text"]:focus, select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        button {
            padding: 11px 22px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            transition: all 0.15s;
        }
        button.primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
        }
        button.primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }
        button.danger {
            background: #1a1d27;
            color: #f87171;
            border: 1px solid #3a2530;
        }
        button.danger:hover {
            background: #2a1a20;
            border-color: #5a3540;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Настройки расширения</h1>
        <p class="subtitle">YT-DLP Extension — расширенные параметры</p>

        <div class="section">
            <h3>Сервер</h3>
            <label for="serverUrl">URL сервера</label>
            <input type="text" id="serverUrl" placeholder="http://localhost:8080">
        </div>

        <div class="section">
            <h3>Параметры загрузки</h3>
            <label for="defaultFormat">Формат по умолчанию</label>
            <select id="defaultFormat">
                <option value="">Сервер по умолчанию</option>
                <option value="best">Лучшее качество</option>
                <option value="worst">Худшее качество</option>
                <option value="mp4">MP4</option>
                <option value="webm">WebM</option>
            </select>
        </div>

        <div class="actions">
            <button id="save" class="primary">Сохранить настройки</button>
            <button id="reset" class="danger">Сбросить</button>
        </div>
    </div>

    <script src="options.js"></script>
</body>
</html>
